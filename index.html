<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Gravity Flip</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1424;
    font-family: "Consolas", "Menlo", "Courier New", monospace; color: #dfe9ff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
    display: flex; justify-content: space-between; pointer-events: none; font-size: 15px; letter-spacing: 2px; }
  .hud b { color: #ff9f1c; font-size: 22px; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: #0d1424d9; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel { width: min(380px, 100%); border: 2px solid #3a4d78; background: #121c33; padding: 26px 22px;
    display: flex; flex-direction: column; gap: 14px; text-align: left; position: relative;
    box-shadow: 0 0 0 6px #121c33, 0 0 0 8px #3a4d78; }
  .panel::before { content: "SYS://STATION-7"; position: absolute; top: -11px; left: 14px; background: #121c33; padding: 0 6px;
    font-size: 11px; color: #7f95c4; letter-spacing: 2px; }
  h1 { font-size: 34px; letter-spacing: 3px; color: #fff; }
  h1 span { color: #ff9f1c; }
  .stripe { height: 8px; background: repeating-linear-gradient(45deg, #ff9f1c 0 10px, #121c33 10px 20px); }
  p { font-size: 14px; line-height: 1.6; color: #a9badf; }
  .kv { display: flex; justify-content: space-between; font-size: 16px; border-bottom: 1px dashed #3a4d78; padding-bottom: 6px; }
  .kv b { color: #2ec4b6; }
  .btn { margin-top: 6px; border: none; background: #ff9f1c; color: #0d1424; font: inherit; font-weight: bold;
    font-size: 18px; letter-spacing: 4px; padding: 14px; cursor: pointer; }
  .btn:active { background: #ffbf69; }
  small { color: #61749e; font-size: 11px; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div>DIST <b id="score">0</b></div><div>CELLS <b id="cells">0</b></div></div>

<div class="overlay" id="menu"><div class="panel">
  <h1>GRAVITY<br><span>FLIP</span></h1>
  <div class="stripe"></div>
  <p>&gt; The station's gravity is broken.<br>&gt; <b>Tap</b> or <b>swipe up / down</b> to flip between floor and ceiling.<br>&gt; Avoid red barriers and holes in the hull.</p>
  <div class="kv"><span>BEST</span><b id="bestMenu">0</b></div>
  <button class="btn" id="startBtn">&gt; RUN_</button>
  <small>KEYBOARD: SPACE / ↑ / ↓</small>
</div></div>
<div class="overlay hidden" id="over"><div class="panel">
  <h1>HULL<br><span>BREACH</span></h1>
  <div class="stripe"></div>
  <div class="kv"><span>DISTANCE</span><b id="finalScore">0</b></div>
  <div class="kv"><span>CELLS</span><b id="finalCells">0</b></div>
  <div class="kv"><span>BEST</span><b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">&gt; REBOOT_</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 100, scale: 'dorian', root: 55, prog: [0, 3, 6, 4], seed: 21,
    waves: { lead: 'square', bass: 'triangle', arp: 'triangle', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadCutoff: 1400, drums: 'soft', volume: 0.15,
    btnBg: 'rgba(255,159,28,.25)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'gravity_flip_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  $('bestMenu').textContent = best;

  let W, H, DPR, S, LW, LH, TOP, BOT;
  const TILE = 40, CORR = 300, PH = 34, PW = 26;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 420, H / 460); LW = W / S; LH = H / S;
    TOP = LH / 2 - CORR / 2; BOT = LH / 2 + CORR / 2;
  }
  addEventListener('resize', resize); resize();
  const hash = n => { const x = Math.sin(n * 77.7) * 43758.5; return x - Math.floor(x); };

  // tiles: index -> {floor, ceil, block: 0 | 1 (floor) | -1 (ceiling), cell: 0|1|-1}
  let state = 'menu', tiles, genIdx, lastSide, cam, speed, pl, cells, t = 0, shake = 0, deadT = 0, bits = [];
  function reset() {
    tiles = []; genIdx = 0; lastSide = 0; cam = 0; speed = 280; cells = 0; bits = [];
    pl = { y: BOT, vy: 0, g: 1, grounded: true, dead: false, coyote: 0, rot: 0 };
    for (let i = 0; i < 14; i++) pushTile({});
  }
  function pushTile(o) { tiles[genIdx++] = Object.assign({ floor: true, ceil: true, block: 0, cell: 0 }, o); }
  function generate() {
    const diff = Math.min(1, cam / 40000);
    const side = Math.random() < 0.5 ? 1 : -1; // 1 = hazard on floor, -1 = on ceiling
    // flight time between surfaces → minimum safe run when the hazard side switches
    const flight = Math.sqrt(2 * (CORR - PH) / 2600) * speed / TILE;
    const safe = side !== lastSide ? Math.ceil(flight) + 2 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 3);
    const cellSide = lastSide ? -lastSide : 1;
    for (let i = 0; i < safe; i++) pushTile({ cell: i > 0 && Math.random() < 0.5 ? cellSide : 0 });
    const len = 2 + Math.floor(Math.random() * (3 + diff * 4));
    const gap = Math.random() < 0.45;
    for (let i = 0; i < len; i++) {
      const o = { cell: Math.random() < 0.4 ? -side : 0 };
      if (gap) { if (side === 1) o.floor = false; else o.ceil = false; }
      else o.block = side;
      pushTile(o);
    }
    lastSide = side;
  }
  reset();
  const score = () => Math.floor(cam / 10);

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    audio.sfx(220, 0.25, 'square', 0.05, 660);
  }
  function die() {
    if (pl.dead) return;
    pl.dead = true; deadT = 1; shake = 12;
    audio.sfx(160, 0.6, 'sawtooth', 0.09, 40);
    if (navigator.vibrate) try { navigator.vibrate(140); } catch (e) {}
    for (let i = 0; i < 24; i++) bits.push({ x: cam + px(), y: pl.y - pl.g * PH / 2, vx: (Math.random() - .5) * 400, vy: (Math.random() - .5) * 400, life: 1 });
  }
  function gameOver() {
    state = 'over';
    const s = score(); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('finalCells').textContent = cells; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    $('over').classList.remove('hidden');
  }
  function flip(dir) {
    if (state !== 'play' || pl.dead) return;
    if (!(pl.grounded || pl.coyote > 0)) return;
    const g = dir || -pl.g;
    if (g === pl.g) return;
    pl.g = g; pl.grounded = false; pl.coyote = 0;
    audio.sfx(pl.g < 0 ? 500 : 340, 0.15, 'triangle', 0.07, pl.g < 0 ? 900 : 180);
  }

  let sy0 = 0, down = false, used = false;
  canvas.addEventListener('pointerdown', e => { sy0 = e.clientY; down = true; used = false; });
  canvas.addEventListener('pointermove', e => {
    if (!down || used) return;
    const dy = e.clientY - sy0;
    if (Math.abs(dy) > 24) { used = true; flip(dy < 0 ? -1 : 1); }
  });
  canvas.addEventListener('pointerup', () => { if (down && !used) flip(0); down = false; });
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    if (e.repeat) return;
    if (e.key === ' ') flip(0); else if (e.key === 'ArrowUp' || e.key === 'w') flip(-1); else if (e.key === 'ArrowDown' || e.key === 's') flip(1);
    else return;
    e.preventDefault();
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  const px = () => Math.min(LW * 0.28, 150);
  const tileAt = x => tiles[Math.floor(x / TILE)];

  function update(dt) {
    t += dt;
    if (state === 'menu') cam += 90 * dt;
    while (genIdx * TILE < cam + LW + 400) generate();
    if (state === 'play') {
      if (!pl.dead) { speed = Math.min(560, 280 + cam / 120); cam += speed * dt; }
      const x = cam + px();
      pl.vy += 2600 * pl.g * dt; pl.y += pl.vy * dt;
      pl.rot += ((pl.g < 0 ? Math.PI : 0) - pl.rot) * Math.min(1, dt * 14);
      pl.coyote -= dt;
      if (!pl.dead) {
        const l = x - PW / 2 + 3, r = x + PW / 2 - 3;
        const tl = tileAt(l), tr = tileAt(r);
        const wasGrounded = pl.grounded;
        pl.grounded = false;
        if (pl.g > 0 && pl.y >= BOT && pl.y - pl.vy * dt <= BOT + 2 && ((tl && tl.floor) || (tr && tr.floor))) { pl.y = BOT; pl.vy = 0; pl.grounded = true; }
        if (pl.g < 0 && pl.y <= TOP && pl.y - pl.vy * dt >= TOP - 2 && ((tl && tl.ceil) || (tr && tr.ceil))) { pl.y = TOP; pl.vy = 0; pl.grounded = true; }
        if (wasGrounded && !pl.grounded) pl.coyote = 0.08;
        if (pl.grounded && !wasGrounded) audio.sfx(120, 0.08, 'triangle', 0.05);
        if (pl.y > BOT + 120 || pl.y < TOP - 120) die();
        // barriers
        const ptop = pl.g > 0 ? pl.y - PH : pl.y, pbot = pl.g > 0 ? pl.y : pl.y + PH;
        for (let i = Math.floor(l / TILE); i <= Math.floor(r / TILE); i++) {
          const tl2 = tiles[i]; if (!tl2) continue;
          if (tl2.block === 1 && pbot > BOT - 90) die();
          if (tl2.block === -1 && ptop < TOP + 90) die();
          if (tl2.cell) {
            const cy = tl2.cell > 0 ? BOT - 26 : TOP + 26;
            if (cy > ptop - 8 && cy < pbot + 8) { tl2.cell = 0; cells++; audio.sfx(1000 + (cells % 4) * 150, 0.08, 'sine', 0.06); }
          }
        }
      } else { deadT -= dt; if (deadT <= 0 && state === 'play') gameOver(); }
    }
    for (const b of bits) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
    bits = bits.filter(b => b.life > 0);
    shake = Math.max(0, shake - dt * 30);
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0d1424'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    // starfield behind windows
    for (let i = 0; i < 70; i++) {
      const x = ((hash(i) * 1600 - cam * (0.05 + hash(i + 5) * 0.1)) % 1600 + 1600) % 1600 * (LW / 1600) * 1.0;
      ctx.fillStyle = 'rgba(200,220,255,' + (0.3 + hash(i + 9) * 0.6) + ')';
      ctx.fillRect(x, hash(i + 3) * LH, 2, 2);
    }
    // back wall panels with windows
    const pw = 160, off = cam * 0.5;
    for (let i = Math.floor(off / pw) - 1; i * pw - off < LW + pw; i++) {
      const x = i * pw - off;
      ctx.fillStyle = '#16213d'; ctx.fillRect(x + 2, TOP + 20, pw - 4, CORR - 40);
      ctx.fillStyle = '#0a0f1c'; ctx.fillRect(x + 30, TOP + 70, pw - 60, CORR - 140);
      ctx.strokeStyle = '#2a3a63'; ctx.lineWidth = 3; ctx.strokeRect(x + 30, TOP + 70, pw - 60, CORR - 140);
      if (hash(i) < 0.4) { ctx.fillStyle = '#ff9f1c55'; ctx.beginPath(); ctx.arc(x + pw / 2, TOP + CORR / 2, 22, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.save(); ctx.translate(-cam, 0);
    const i0 = Math.floor(cam / TILE) - 1, i1 = Math.ceil((cam + LW) / TILE) + 1;
    for (let i = i0; i <= i1; i++) {
      const tl = tiles[i]; if (!tl) continue;
      const x = i * TILE;
      for (const side of [1, -1]) {
        const present = side > 0 ? tl.floor : tl.ceil;
        if (!present) continue;
        const y = side > 0 ? BOT : TOP - 60;
        ctx.fillStyle = '#3a4d78'; ctx.fillRect(x, y, TILE, 60);
        ctx.fillStyle = '#4f659a'; ctx.fillRect(x, side > 0 ? y : y + 54, TILE, 6);
        ctx.fillStyle = '#2a3a63'; ctx.fillRect(x + TILE - 2, y, 2, 60);
        ctx.fillStyle = '#ff9f1c';
        if (i % 4 === 0) ctx.fillRect(x + 8, side > 0 ? y + 16 : y + 36, 6, 6);
        // hazard stripes at gap edges
        const nb = tiles[i + 1], pb = tiles[i - 1];
        const edge = (nb && !(side > 0 ? nb.floor : nb.ceil)) || (pb && !(side > 0 ? pb.floor : pb.ceil));
        if (edge) { for (let k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? '#ff9f1c' : '#222'; ctx.fillRect(x + k * 10, side > 0 ? y + 6 : y + 44, 10, 10); } }
      }
      if (tl.block) {
        const y = tl.block > 0 ? BOT - 90 : TOP;
        const fl = 0.6 + Math.sin(t * 20 + i) * 0.2;
        ctx.fillStyle = 'rgba(255,60,60,' + (0.25 * fl) + ')'; ctx.fillRect(x - 4, y, TILE + 8, 90);
        ctx.fillStyle = '#ff3b3b'; ctx.fillRect(x + 6, y, TILE - 12, 90);
        ctx.fillStyle = '#ffd0d0'; ctx.fillRect(x + TILE / 2 - 2, y, 4, 90);
      }
      if (tl.cell) {
        const cy = tl.cell > 0 ? BOT - 26 : TOP + 26, cx = x + TILE / 2 + Math.sin(t * 4 + i) * 2;
        ctx.fillStyle = '#2ec4b633'; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2ec4b6'; ctx.fillRect(cx - 5, cy - 9, 10, 18);
        ctx.fillStyle = '#e0fffb'; ctx.fillRect(cx - 2, cy - 12, 4, 3);
      }
    }
    // player: little astronaut
    if (!pl.dead || deadT > 0.85) {
      const x = cam + px();
      ctx.save(); ctx.translate(x, pl.y); ctx.rotate(pl.rot);
      const run = pl.grounded ? Math.sin(t * 22) : 0.6;
      ctx.fillStyle = '#c9d6f2';
      ctx.fillRect(-9, -10, 6, 10 + run * 2); ctx.fillRect(3, -10, 6, 10 - run * 2);
      ctx.fillStyle = '#f2f5ff'; ctx.fillRect(-12, -28, 24, 20);
      ctx.fillStyle = '#ff9f1c'; ctx.fillRect(-12, -18, 24, 3);
      ctx.fillStyle = '#9fb1d8'; ctx.fillRect(-17, -27, 6, 14);
      ctx.fillStyle = '#f2f5ff'; ctx.beginPath(); ctx.arc(0, -36, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b2a4d'; ctx.beginPath(); ctx.ellipse(4, -36, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2ec4b6'; ctx.fillRect(5, -39, 3, 3);
      ctx.restore();
    }
    for (const b of bits) { ctx.globalAlpha = b.life; ctx.fillStyle = b.life > 0.5 ? '#ff9f1c' : '#c9d6f2'; ctx.fillRect(b.x, b.y, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
    $('score').textContent = score(); $('cells').textContent = cells;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
